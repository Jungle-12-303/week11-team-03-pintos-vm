name: branch-policy

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to validate manually
        required: true
        type: string
  pull_request:
    branches:
      - main
      - dev
      - team
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  branch-policy:
    name: branch-policy
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch policy
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.inputs.pr_number || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const https = require('https');

          const teamMembers = [
            'HyungminYoon1',
            'HyeYeonLee0112',
            'Cho1022',
            'choihyunjin1',
          ];

          const allowedRemoteBranches = ['main', 'dev', 'team', 'pair-a', 'pair-b'];
          const pairBranches = ['pair-a', 'pair-b'];

          const eventName = process.env.GITHUB_EVENT_NAME;
          const repository = process.env.GITHUB_REPOSITORY;
          const token = process.env.GITHUB_TOKEN;
          const runUrl = process.env.RUN_URL;
          const payloadText = fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8').replace(/^\uFEFF/, '');
          const payload = JSON.parse(payloadText);
          let pr = payload.pull_request;

          function request(method, path, body) {
            return new Promise((resolve, reject) => {
              const data = body ? JSON.stringify(body) : undefined;
              const req = https.request({
                hostname: 'api.github.com',
                path,
                method,
                headers: {
                  'Accept': 'application/vnd.github+json',
                  'Authorization': `Bearer ${token}`,
                  'Content-Type': 'application/json',
                  'User-Agent': 'branch-policy-workflow',
                  'X-GitHub-Api-Version': '2022-11-28',
                },
              }, (res) => {
                let response = '';
                res.setEncoding('utf8');
                res.on('data', (chunk) => {
                  response += chunk;
                });
                res.on('end', () => {
                  let parsed = {};
                  if (response) {
                    try {
                      parsed = JSON.parse(response);
                    } catch (error) {
                      reject(new Error(`GitHub API returned invalid JSON: ${error.message}`));
                      return;
                    }
                  }

                  if (res.statusCode < 200 || res.statusCode >= 300) {
                    reject(new Error(parsed.message || `GitHub API request failed with ${res.statusCode}`));
                    return;
                  }

                  resolve(parsed);
                });
              });

              req.on('error', reject);
              if (data) {
                req.write(data);
              }
              req.end();
            });
          }

          async function reportManualStatus(state, description) {
            if (eventName !== 'workflow_dispatch' || !pr?.head?.sha) {
              return;
            }

            try {
              await request('POST', `/repos/${repository}/statuses/${pr.head.sha}`, {
                state,
                context: 'branch-policy',
                description: description.slice(0, 140),
                target_url: runUrl,
              });
            } catch (error) {
              console.warn(`Could not report manual branch-policy status: ${error.message}`);
            }
          }

          function fail(message) {
            throw new Error(message);
          }

          async function main() {
            try {
              if (eventName === 'workflow_dispatch') {
                const prNumberInput = process.env.PR_NUMBER;
                if (!prNumberInput) {
                  fail('workflow_dispatch requires pr_number input.');
                }

                const prNumber = Number.parseInt(prNumberInput, 10);
                if (!Number.isInteger(prNumber) || prNumber <= 0) {
                  fail(`pr_number must be a positive integer. Current value: ${prNumberInput}.`);
                }

                pr = await request('GET', `/repos/${repository}/pulls/${prNumber}`);
              }

              const baseBranch = pr.base.ref;
              const headBranch = pr.head.ref;
              const prAuthor = pr.user.login;
              const headRepo = pr.head.repo.full_name;
              const baseRepo = pr.base.repo.full_name;

              if (pr.state !== 'open') {
                fail(`Pull request #${pr.number} must be open. Current state: ${pr.state}.`);
              }

              if (headRepo !== baseRepo) {
                fail(`Pull requests must come from this repository, not ${headRepo}.`);
              }

              if (!allowedRemoteBranches.includes(baseBranch) || !allowedRemoteBranches.includes(headBranch)) {
                fail(
                  `Only main, dev, team, pair-a, and pair-b branches are allowed in pull requests. ` +
                  `Current flow: ${headBranch} -> ${baseBranch}.`
                );
              }

              if (baseBranch === 'main') {
                if (headBranch !== 'dev') {
                  fail(`Only dev -> main pull requests are allowed. Current head branch: ${headBranch}.`);
                }

                console.log('Allowed dev -> main pull request.');
                await reportManualStatus('success', 'Branch policy passed.');
                return;
              }

              if (baseBranch === 'dev') {
                if (headBranch !== 'team') {
                  fail(`Only team -> dev pull requests are allowed. Current head branch: ${headBranch}.`);
                }

                if (!teamMembers.includes(prAuthor)) {
                  fail(
                    `team -> dev pull requests must be opened by one of: ` +
                    `${teamMembers.join(', ')}. Current author: ${prAuthor}.`
                  );
                }

                console.log(`Allowed team -> dev pull request by ${prAuthor}.`);
                await reportManualStatus('success', 'Branch policy passed.');
                return;
              }

              if (baseBranch === 'team') {
                if (!pairBranches.includes(headBranch)) {
                  fail(`Only pair-a/pair-b -> team pull requests are allowed. Current head branch: ${headBranch}.`);
                }

                if (!teamMembers.includes(prAuthor)) {
                  fail(
                    `pair -> team pull requests must be opened by one of: ` +
                    `${teamMembers.join(', ')}. Current author: ${prAuthor}.`
                  );
                }

                console.log(`Allowed ${headBranch} -> team pull request by ${prAuthor}.`);
                await reportManualStatus('success', 'Branch policy passed.');
                return;
              }

              fail(`No branch policy applies to ${headBranch} -> ${baseBranch}.`);
            } catch (error) {
              await reportManualStatus('failure', error.message || 'Branch policy failed.');
              throw error;
            }
          }

          main().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
